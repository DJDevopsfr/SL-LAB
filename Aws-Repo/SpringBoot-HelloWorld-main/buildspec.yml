version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REPOSITORY: "devops-project"
    IMAGE_TAG: "springboot-helloworld"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
      - echo "ECR URI = $ECR_URI"

  build:
    commands:
      - echo "Build started on $(date)"

      # Go to the directory containing your Dockerfile
      - cd $CODEBUILD_SRC_DIR/Aws-Repo/SpringBoot-HelloWorld-main/HelloWorld

      - echo "Building Docker image..."
      - docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

      - docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $ECR_URI:$IMAGE_TAG

      - echo "Creating imagedefinitions.json..."

      # IMPORTANT: put the file at the CodeBuild artifact root
      - cd $CODEBUILD_SRC_DIR
      - printf '[{"name":"Hellocontainer","imageUri":"%s"}]' "$ECR_URI:$IMAGE_TAG" > imagedefinitions.json

      - echo "Checking imagedefinitions.json:"
      - cat imagedefinitions.json

      - echo "Location:"
      - pwd
      - ls -lh imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
