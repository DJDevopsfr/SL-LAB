---
- name: Install Apache (httpd)
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Ensure Apache is started and enabled
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: yes

- name: Deploy index.html
  ansible.builtin.copy:
    src: index.html
    dest: "{{ web_root }}/{{ index_file }}"
    owner: "{{ apache_user }}"
    group: "{{ apache_group }}"
    mode: "0644"
  notify: restart apache

